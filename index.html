<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valheim · Itens To-Do</title>
<style>
:root{
  /* fundo: preto topo → vermelho escuro base (degradê) */
  --bg-top:#0a0808;
  --bg-bot:#1a0e0a;
  --bg-mid:#120b08;
  --card:#1a1115;
  --card2:#241619;
  --line:#3a2225;
  --line2:#522a2e;
  --txt:#f2e8e5;
  --mut:#a08080;
  --dim:#6a5555;
  --gold:#e8b84a;
  --accent:#d04a4a;
  --accent2:#a83030;
  --green:#5cb878;
  --glow:rgba(216,72,72,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font:15px/1.5 "Segoe UI",system-ui,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(ellipse 140% 100% at 50% 0%, var(--bg-top) 0%, transparent 60%),
    radial-gradient(ellipse 140% 80% at 50% 100%, var(--bg-bot) 0%, var(--bg-mid) 50%),
    var(--bg-mid);
  background-attachment:fixed;
  padding-bottom:60px;
}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}

/* ── header ── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,8,8,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:12px 0;
}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.3px}
h1 .rune{color:var(--accent);font-size:20px;margin-right:4px}
.stats{display:flex;gap:9px;align-items:center;margin-left:auto;flex-wrap:wrap}
.pill{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:3px 11px;font-size:12.5px;color:var(--mut)
}
.pill b{color:var(--txt);font-size:13px}
.pill.todo b{color:var(--accent)}
.pill.done b{color:var(--green)}
.bar{width:140px;height:7px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .35s}
.btn{
  cursor:pointer;background:var(--card);color:var(--txt);
  border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:12.5px;transition:all .15s
}
.btn:hover{background:var(--card2);border-color:var(--accent);color:#fff}

/* ── toolbar ── */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
.search{
  flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:9px 14px;color:var(--txt);font-size:14px;transition:border-color .15s
}
.search:focus{outline:none;border-color:var(--accent)}
.search::placeholder{color:var(--dim)}
select{
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer
}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);cursor:pointer}

/* ── chips ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{
  cursor:pointer;background:var(--card);border:1px solid var(--line);
  color:var(--mut);border-radius:18px;padding:4px 13px;font-size:12.5px;
  user-select:none;transition:all .12s
}
.chip:hover{border-color:var(--line2);color:var(--txt)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* ── main layout ── */
main{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
@media(max-width:960px){main{grid-template-columns:1fr}}

.panel{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.35)
}
.col-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.panel h2{
  font-size:12px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--mut);margin:0;font-weight:600
}
.count{color:var(--accent);font-weight:800;font-size:14px}
.note{font-size:11px;color:var(--dim);margin:0 0 10px;line-height:1.4}

/* ── catalog grid (estilo genshindb) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.tile{
  position:relative;background:var(--card2);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;cursor:pointer;
  display:flex;gap:10px;align-items:flex-start;
  transition:transform .09s,border-color .14s,box-shadow .14s;
  overflow:hidden
}
.tile::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 30%, var(--glow), transparent 70%);
  opacity:0;transition:opacity .14s;pointer-events:none
}
.tile:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 4px 16px rgba(216,72,72,.15)}
.tile:hover::before{opacity:1}
.tile .ph{
  flex:0 0 52px;width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.28);border-radius:9px;overflow:hidden
}
.tile .ph img{max-width:50px;max-height:50px;image-rendering:pixelated;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
/* glifos SVG por categoria */
.tile .ph svg{width:26px;height:26px;opacity:.7}
.tile .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tile .nm{font-size:13.5px;font-weight:700;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{
  font-size:10px;padding:2px 7px;border-radius:5px;
  background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--mut)
}
.tag.cat{color:var(--gold);border-color:rgba(232,184,74,.35);font-weight:600}
.tag.bio{color:#6a9ad0}
.tag.craft{color:var(--green)}
.tile .costline{font-size:10px;color:var(--dim);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{
  position:absolute;top:8px;right:8px;width:20px;height:20px;
  border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;opacity:0;transition:opacity .1s
}
.tile:hover .plus{opacity:1}
.empty{color:var(--dim);font-size:13px;padding:16px 4px;text-align:center}

/* ── side panels (to-do / feitos) ── */
.stack{display:flex;flex-direction:column;gap:14px}
.seq{display:flex;flex-direction:column;gap:8px}
.item{
  position:relative;display:flex;gap:10px;align-items:center;
  background:var(--card2);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;cursor:pointer;
  transition:border-color .14s,background .14s
}
.item:hover{border-color:var(--line2)}
.item .ph{
  flex:0 0 44px;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.28);border-radius:8px;overflow:hidden
}
.item .ph img{max-width:42px;max-height:42px;image-rendering:pixelated;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.item .ph svg{width:22px;height:22px;opacity:.65}
.item .meta{flex:1;min-width:0}
.item .nm{font-size:13.5px;font-weight:600}
.item .sub{font-size:11px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub .craft{color:var(--green)}
.item .sub .anyone{color:var(--gold)}
/* próximo na fila */
.item.next{
  border-color:var(--gold);
  background:linear-gradient(135deg,rgba(232,184,74,.12),var(--card2));
  box-shadow:0 0 0 1px rgba(232,184,74,.25),0 6px 18px rgba(232,184,74,.12)
}
.badge{
  position:absolute;left:10px;top:-10px;
  background:var(--gold);color:#1a1205;font-weight:800;font-size:9.5px;
  letter-spacing:.6px;padding:2px 8px;border-radius:0 0 5px 5px;
  text-transform:uppercase
}
/* feitos */
.item.done-item{opacity:.65}
.item.done-item .nm{color:var(--mut);text-decoration:line-through}
.item.done-item:hover{opacity:1}
.act{flex:0 0 auto;display:flex;flex-direction:column;gap:2px}
.act button{
  background:none;border:none;color:var(--dim);cursor:pointer;
  font-size:17px;padding:2px 4px;transition:color .1s
}
.item:hover .act button{color:var(--accent)}
.item.done-item:hover .act button{color:var(--green)}

/* ── box de receita / materiais ── */
.recipe{
  background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-top:4px;position:relative;overflow:hidden
}
.recipe::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(var(--accent),var(--gold))
}
.rtitle{
  font-size:14px;font-weight:700;margin-bottom:9px;padding-left:6px
}
.rtitle .rtag{font-size:10px;font-weight:600;color:var(--gold);
  border:1px solid rgba(232,184,74,.4);border-radius:5px;padding:1px 6px;
  margin-left:8px;vertical-align:middle}
.rhead{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 9px 6px}
.rhead span{font-size:11px;padding:2px 8px;border-radius:6px;
  background:rgba(0,0,0,.3);border:1px solid var(--line)}
.rhead .rstation{color:var(--green)}
.rhead .rbio{color:#6a9ad0}
.rhead .rany{color:var(--gold)}
.rlist{display:flex;flex-direction:column;gap:5px;padding-left:6px}
.rrow{display:flex;align-items:center;gap:8px;font-size:13px}
.rrow .rmic{flex:0 0 26px;width:26px;height:26px;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.3);border-radius:6px;overflow:hidden}
.rrow .rmic img{max-width:22px;max-height:22px;image-rendering:pixelated;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.rrow .rmic svg{width:15px;height:15px;opacity:.6}
.rrow .rname{flex:1;color:var(--txt)}
.rrow .ramt{font-weight:700;color:var(--gold);min-width:34px;text-align:right}
.rrow .up{font-size:10px;color:var(--dim)}
.rnote{font-size:11px;color:var(--dim);padding-left:6px;margin-top:4px}
</style>
</head>
<body>

<header><div class="wrap">
  <h1><span class="rune">ᚨ</span> Valheim &middot; Itens To-Do</h1>
  <div class="stats">
    <span class="pill todo"><b id="cTodo">0</b> na fila</span>
    <span class="pill done"><b id="cDone">0</b> feitos</span>
    <div class="bar"><i id="bar"></i></div>
    <button class="btn" id="reset">Zerar tudo</button>
  </div>
</div></header>

<div class="wrap">
  <div class="toolbar">
    <input class="search" id="q" placeholder="Buscar item…">
    <select id="biome"><option value="">Biome: todos</option></select>
    <label class="toggle"><input type="checkbox" id="showCost"> custo no catálogo</label>
  </div>
  <div class="chips" id="chips"></div>

  <main>
    <section class="panel">
      <div class="col-head">
        <h2>Catálogo <span class="count" id="cCat">0</span></h2>
      </div>
      <p class="note">Clique numa imagem para incluí-la na fila. Use busca, categoria ou biome para filtrar.</p>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="stack">
      <section class="panel">
        <div class="col-head">
          <h2>To-Do <span class="count" id="cToDo">0</span></h2>
        </div>
        <p class="note">Clique no item para marcá-lo como <b>feito</b>. O destaque dourado é o <b>próximo</b>.</p>
        <div class="seq" id="todo"></div>
        <div id="recipe"></div>
      </section>
      <section class="panel">
        <div class="col-head">
          <h2>Feitos <span class="count" id="cFeito">0</span></h2>
          <button class="btn" id="clearDone" style="font-size:11px;padding:3px 9px">voltar todos</button>
        </div>
        <div class="seq" id="done"></div>
      </section>
    </aside>
  </main>
</div>

/* ── state ── */
const KEY = "valheim-todo-v2";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || {todo:[],done:[]}; }
catch(e){ state = {todo:[],done:[]}; }
// migrate from v1 (if present)
try {
  const raw1 = localStorage.getItem("valheim-todo-v1");
  if (raw1) {
    const old = JSON.parse(raw1);
    state = { todo:[...new Set([ ...(old.todo||[]), ...(old.done||[])])], done:[] };
  }
} catch(e){}
if (!state.todo) state.todo = [];
if (!state.done) state.done = [];
let view = { q:"", cat:"", biome:"", showCost:false };
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
const inTodo = id => state.todo.includes(id);
const inDone = id => state.done.includes(id);

function costText(o){
  if (!o.cost.length) return "";
  const ing = o.cost.map(c => c.length>2
    ? c[0]+"×"+c[1]+"(+"+c[2]+"/nv)"
    : c[0]+"×"+c[1]).join(" · ");
  const st = o.s ? '<span style="color:var(--mut)">'+o.s+":</span> " : "";
  if (o.a) return '<span class="anyone">⚒ '+o.cost.length+' escolhas: '+ing+'</span>';
  return '<span class="craft">⚒ '+st+ing+'</span>';
}

/* Box de receita: mostra os materiais do próximo na fila */
function recipeBox(){
  const box = document.getElementById("recipe");
  if (!box) return;
  const id = state.todo[0];
  if (!id){ box.innerHTML = ""; return; }
  const o = BY_ID[id];
  const head = [];
  if (o.s) head.push('<span class="rstation">⚒ '+(o.s==="Mão"||o.s===""?"Mão":o.s)+"</span>");
  if (o.b) head.push('<span class="rbio">'+o.b+"</span>");
  if (o.a) head.push('<span class="rany">escolha 1 de '+o.cost.length+"</span>");

  const base = o.cost.filter(c => (c[1]||0) > 0);
  const up   = o.cost.filter(c => c.length>2 && (c[2]||0) > 0);
  const rows = base.map(c =>
    '<div class="rrow">'+matIcon(c[0])+'<span class="rname">'+c[0]+'</span>'+
    '<span class="ramt">×'+c[1]+'</span></div>'
  ).join("");
  const upRows = up.map(c =>
    '<div class="rrow" style="opacity:.6">'+matIcon(c[0])+
    '<span class="rname">'+c[0]+' <span class="up">(apenas upgrade)</span></span>'+
    '<span class="ramt up">+'+c[2]+'/nv</span></div>'
  ).join("");

  box.innerHTML =
    '<div class="recipe">'+
      '<div class="rtitle">'+o.n+'<span class="rtag">próximo na fila</span></div>'+
      (head.length ? '<div class="rhead">'+head.join("")+"</div>" : "")+
      (base.length ? '<div class="rlist">'+rows+"</div>" : '<div class="rnote">Sem receita de craft — item obtido por outro meio (loot, caça, pescaria…).</div>')+
      (upRows ? '<div class="rlist" style="margin-top:6px">'+upRows+'</div>' : "")+
    "</div>";
}

/* ── actions ── */
function addToDo(id){ if(!inTodo(id)&&!inDone(id)){ state.todo.push(id); save(); render(); } }
function complete(id){ if(inTodo(id)){ state.todo=state.todo.filter(x=>x!==id); state.done.push(id); save(); render(); } }
function reopen(id){ if(inDone(id)){ state.done=state.done.filter(x=>x!==id); state.todo.push(id); save(); render(); } }
function resetAll(){ if(confirm("Zerar fila e feitos?")){ state={todo:[],done:[]}; save(); render(); } }

/* ── render ── */
function render(){
  const q = view.q.toLowerCase();
  const avail = ITEMS.filter(o => {
    if (inTodo(o.id)||inDone(o.id)) return false;
    if (view.cat   && o.c !== view.cat) return false;
    if (view.biome && o.b !== view.biome) return false;
    if (q && !(o.n.toLowerCase().includes(q)||o.c.toLowerCase().includes(q))) return false;
    return true;
  });

  const grid = document.getElementById("grid");
  grid.innerHTML = avail.length ? avail.map(o =>
    '<div class="tile" onclick="addToDo(\''+o.id+'\')">'+
      '<div class="ph">'+iconBlock(o)+'</div>'+
      '<div class="info">'+
        '<div class="nm" title="'+o.n+'">'+o.n+'</div>'+
        '<div class="tags">'+
          '<span class="tag cat">'+o.c+'</span>'+
          (o.b ? '<span class="tag bio">'+o.b+'</span>' : "")+
          (o.cost.length ? '<span class="tag craft">⚒</span>' : "")+
        '</div>'+
        (view.showCost && o.cost.length ? '<div class="costline">'+costText(o)+'</div>' : "")+
      '</div>'+
      '<div class="plus">+</div>'+
    '</div>'
  ).join("") : '<div class="empty" style="grid-column:1/-1">Nenhum item disponível com esses filtros.</div>';
  document.getElementById("cCat").textContent = avail.length;

  /* to-do */
  const tEl = document.getElementById("todo");
  tEl.innerHTML = state.todo.length ? state.todo.map((id,i) => {
    const o = BY_ID[id], nx = i===0;
    return '<div class="item'+(nx?' next':"")+'" onclick="complete(\''+o.id+'\')">'+
      (nx ? '<div class="badge">▶ próximo</div>' : "")+
      '<div class="ph">'+iconBlock(o)+'</div>'+
      '<div class="meta"><div class="nm">'+o.n+'</div>'+
        '<div class="sub">'+o.c+(o.b?" · "+o.b:"")+(o.cost.length?" · "+costText(o):"")+'</div></div>'+
      '<div class="act"><button title="Feito" onclick="event.stopPropagation();complete(\''+o.id+'\')">✓</button></div>'+
    '</div>';
  }).join("") : '<div class="empty">Fila vazia — clique num item do catálogo para começar.</div>';

  /* feitos */
  const dEl = document.getElementById("done");
  dEl.innerHTML = state.done.length ? state.done.map(id => {
    const o = BY_ID[id];
    return '<div class="item done-item" onclick="reopen(\''+o.id+'\')">'+
      '<div class="ph">'+iconBlock(o)+'</div>'+
      '<div class="meta"><div class="nm">'+o.n+'</div><div class="sub">'+o.c+(o.b?" · "+o.b:"")+'</div></div>'+
      '<div class="act"><button title="Reabrir" onclick="event.stopPropagation();reopen(\''+o.id+'\')">↩</button></div>'+
    '</div>';
  }).join("") : '<div class="empty">Nada feito ainda.</div>';

  /* stats */
  document.getElementById("cTodo").textContent  = state.todo.length;
  document.getElementById("cDone").textContent   = state.done.length;
  document.getElementById("cFeito").textContent = state.done.length;
  document.getElementById("cToDo").textContent   = state.todo.length;
  const total = state.todo.length + state.done.length;
  document.getElementById("bar").style.width = total ? (state.done.length/total*100)+"%" : "0%";
  recipeBox();
}

/* ── controls ── */
function buildChips(){
  const cats = ["", ...[...new Set(ITEMS.map(o=>o.c))].sort((a,b)=>a.localeCompare(b))];
  document.getElementById("chips").innerHTML = cats.map(c =>
    '<div class="chip'+(c===""?" on":"")+'" data-c="'+c+'" onclick="pickCat(this,\''+c+'\')">'+(c||"Todos")+'</div>'
  ).join("");
}
function pickCat(el,c){
  view.cat = c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c===c));
  render();
}
function buildBiomes(){
  const order = ["Meadows","Black Forest","Ocean","Swamp","Mountain","Plains","Mistlands","Ashlands","Deep North"];
  const b = [...new Set(ITEMS.map(o=>o.b).filter(Boolean))]
    .sort((x,y) => (order.indexOf(x)<0?99:order.indexOf(x)) - (order.indexOf(y)<0?99:order.indexOf(y)));
  document.getElementById("biome").innerHTML =
    '<option value="">Biome: todos</option>'+b.map(x=>'<option>'+x+'</option>').join("");
}
document.getElementById("q").oninput = e => { view.q = e.target.value; render(); };
document.getElementById("biome").onchange = e => { view.biome = e.target.value; render(); };
document.getElementById("showCost").onchange = e => { view.showCost = e.target.checked; render(); };
document.getElementById("reset").onclick = resetAll;
document.getElementById("clearDone").onclick = () => {
  if(confirm("Mover todos os feitos de volta para o To-Do?")){
    state.todo = state.done.concat(state.todo); state.done = []; save(); render();
  }
};

buildChips(); buildBiomes(); render();
</script>
</body>
</html>
